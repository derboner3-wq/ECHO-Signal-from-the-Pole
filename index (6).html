<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="description" content="ЭХО — текстовая история на полярной станции «Полюс-1». 6 концовок.">
<title>ЭХО — сигнал с Полюса</title>
<style>
:root{
  --bg:#04070d; --panel:#0a1424; --line:rgba(127,215,255,.28);
  --acc:#7fd7ff; --acc2:#b6f0ff; --dim:#8fa6bd; --txt:#d7e6f5; --txt2:#b9cde2;
  --warm:#ffb454; --bad:#ff5d5d; --good:#7dffa8; --rare:#c39bff; --true:#ffd166; --silent:#7fe3d2;
  --mono:'Consolas','Courier New','Menlo',monospace;
  --ui:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--ui);overflow:hidden;user-select:none}
#snow{position:fixed;inset:0;z-index:1;pointer-events:none}
#scanlines{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
#vignette{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
body.no-fx #scanlines,body.no-fx #vignette{display:none}

.screen{display:none;position:fixed;inset:0;z-index:3}
.screen.active{display:block}
#screen-menu.active,#screen-ending.active{display:flex;align-items:center;justify-content:center}

/* ---------- MENU ---------- */
#screen-menu{background:
  radial-gradient(1200px 600px at 50% 115%,rgba(127,215,255,.10),transparent 60%),
  radial-gradient(900px 500px at 85% -10%,rgba(195,155,255,.07),transparent 60%),
  linear-gradient(180deg,#050a14 0%,#04070d 60%,#060c16 100%)}
.menu-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px;z-index:4}
.menu-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.42em;color:var(--dim);text-transform:uppercase}
#menu-title{position:relative;font-family:var(--mono);font-weight:700;
  font-size:clamp(64px,17vw,150px);letter-spacing:.16em;line-height:1;margin:18px 0 6px;
  color:#eef9ff;text-shadow:0 0 30px rgba(127,215,255,.35)}
#menu-title::before,#menu-title::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;overflow:hidden}
#menu-title::before{color:var(--acc);z-index:-1;animation:gl-a 3.2s infinite steps(1)}
#menu-title::after{color:#ff6f9c;z-index:-2;animation:gl-b 2.7s infinite steps(1)}
@keyframes gl-a{0%,92%{transform:none;opacity:.0}93%{transform:translate(-3px,1px);opacity:.8}95%{transform:translate(2px,-1px);opacity:.6}97%{transform:none;opacity:0}100%{opacity:0}}
@keyframes gl-b{0%,89%{transform:none;opacity:0}90%{transform:translate(3px,-2px);opacity:.7}93%{transform:translate(-2px,1px);opacity:.5}96%{opacity:0}100%{opacity:0}}
.menu-sub{font-family:var(--mono);font-size:13px;letter-spacing:.34em;color:var(--acc);text-transform:uppercase}
.menu-nav{display:flex;flex-direction:column;gap:13px;margin-top:38px;width:min(380px,82vw)}
.mbtn{font-family:var(--mono);font-size:14px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--txt);background:rgba(10,20,36,.55);border:1px solid var(--line);
  padding:14px 18px;cursor:pointer;transition:all .18s ease;text-align:center}
.mbtn:hover{background:rgba(127,215,255,.10);border-color:var(--acc);color:#fff;
  box-shadow:0 0 18px rgba(127,215,255,.22),inset 0 0 12px rgba(127,215,255,.06)}
.mbtn:active{transform:scale(.985)}
.mbtn.small{padding:10px 14px;font-size:12px}
.menu-foot{margin-top:42px;display:flex;gap:22px;font-family:var(--mono);font-size:11px;
  letter-spacing:.14em;color:var(--dim);flex-wrap:wrap;justify-content:center}

/* ---------- OVERLAYS ---------- */
.overlay{display:none;position:fixed;inset:0;z-index:60;align-items:center;justify-content:center;
  background:rgba(2,6,12,.8);backdrop-filter:blur(4px)}
.overlay.active{display:flex}
.panel{position:relative;width:min(560px,93vw);max-height:88vh;overflow:auto;background:rgba(10,20,36,.96);
  border:1px solid var(--line);padding:26px 28px 24px;box-shadow:0 0 60px rgba(0,0,0,.6)}
.panel.wide{width:min(780px,95vw)}
.panel h3{font-family:var(--mono);font-weight:600;font-size:16px;letter-spacing:.3em;
  color:var(--acc);margin:0 0 20px;text-transform:uppercase}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:15px 0;font-size:13px;letter-spacing:.05em}
.row select{background:#0c1830;color:var(--txt);border:1px solid var(--line);
  font-family:var(--mono);font-size:12px;padding:6px 10px;letter-spacing:.08em;outline:none}
.row input[type=range]{width:min(220px,52vw);accent-color:var(--acc);cursor:pointer}
.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc);cursor:pointer}
.note{font-size:11px;color:var(--dim);line-height:1.6;margin:4px 0 14px;font-family:var(--mono)}
.row-btns{display:flex;gap:12px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
#confirm-text{font-size:14px;line-height:1.7;color:var(--txt2)}
.ov-x{position:absolute;top:12px;right:12px;width:34px;height:34px;font-family:var(--mono);font-size:15px;
  color:var(--dim);background:rgba(10,20,36,.5);border:1px solid var(--line);cursor:pointer;transition:all .15s;line-height:1}
.ov-x:hover{color:#fff;border-color:var(--bad);background:rgba(255,93,93,.12)}
#fs-exit{display:none;position:fixed;top:14px;right:14px;z-index:200;width:44px;height:44px;
  font-family:var(--mono);font-size:17px;color:var(--txt);background:rgba(10,20,36,.85);
  border:1px solid var(--line);cursor:pointer;transition:all .15s;line-height:1}
#fs-exit.show{display:block}
#fs-exit:hover{border-color:var(--acc);color:#fff;box-shadow:0 0 14px rgba(127,215,255,.3)}
#btn-fs[disabled]{opacity:.45;cursor:default}
#btn-fs[disabled]:hover{background:rgba(10,20,36,.55);border-color:var(--line);color:var(--txt);box-shadow:none}

::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:rgba(127,215,255,.25)}
::-webkit-scrollbar-track{background:transparent}
/* ---------- GAME SCREEN ---------- */
#screen-game{background:
  radial-gradient(1000px 500px at 50% 110%,rgba(127,215,255,.07),transparent 60%),
  linear-gradient(180deg,#050a14,#04070d)}
#hud{position:absolute;top:0;left:0;right:0;display:flex;gap:20px;align-items:center;
  padding:14px 20px;z-index:6;background:linear-gradient(180deg,rgba(4,7,13,.9),rgba(4,7,13,0))}
.stat{display:flex;flex-direction:column;gap:5px;width:118px}
.stat-name{font-family:var(--mono);font-size:9px;letter-spacing:.24em;color:var(--dim)}
.bar{height:6px;background:rgba(127,215,255,.10);border:1px solid rgba(127,215,255,.22)}
.bar i{display:block;height:100%;width:50%;transition:width .5s ease}
#bar-trust{background:var(--acc)} #bar-sanity{background:var(--rare)} #bar-power{background:var(--warm)}
#hud-know{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  color:var(--txt);border:1px solid var(--line);padding:7px 12px;background:rgba(10,20,36,.5);cursor:help}
#btn-pause{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--txt);
  background:rgba(10,20,36,.5);border:1px solid var(--line);padding:8px 14px;cursor:pointer;transition:all .15s}
#btn-pause:hover{border-color:var(--acc);color:#fff}

#chapter-card{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;background:rgba(4,7,13,.86);
  opacity:0;transition:opacity .7s ease;text-align:center;padding:20px}
#chapter-card.show{display:flex;opacity:1}
#ch-num{font-family:var(--mono);font-size:12px;letter-spacing:.5em;color:var(--dim)}
#ch-name{font-family:var(--mono);font-size:clamp(30px,7vw,52px);letter-spacing:.3em;color:#eef9ff;
  text-shadow:0 0 26px rgba(127,215,255,.35);text-transform:uppercase}

#stage{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;padding:86px 16px 26px}
#dialog{width:min(880px,97vw);min-height:148px;background:rgba(8,16,30,.93);
  border:1px solid var(--line);border-left:3px solid var(--acc);
  padding:20px 26px 26px;cursor:pointer;position:relative;transition:border-color .3s}
#dialog.echo{border-left-color:#ff6f9c;box-shadow:0 0 30px rgba(255,111,156,.12)}
#speaker{font-family:var(--mono);font-size:12px;letter-spacing:.28em;color:var(--acc);
  margin-bottom:10px;min-height:15px;text-transform:uppercase}
#speaker.who-echo{color:#ff8fb1}
#text{font-family:var(--mono);font-size:16px;line-height:1.8;color:var(--txt);
  white-space:pre-wrap;min-height:58px;word-wrap:break-word}
#text.echo-line{color:#c9f4ff;text-shadow:1.2px 0 rgba(255,80,120,.55),-1.2px 0 rgba(80,255,220,.55)}
#next-hint{position:absolute;right:18px;bottom:10px;color:var(--acc);opacity:.65;
  font-size:12px;animation:blink 1.2s infinite;display:none}
@keyframes blink{0%,100%{opacity:.15}50%{opacity:.75}}

#choices{width:min(880px,97vw);display:flex;flex-direction:column;gap:10px;margin-top:12px}
.choice{font-family:var(--mono);font-size:13px;line-height:1.5;text-align:left;
  color:var(--txt);background:rgba(10,20,36,.72);border:1px solid var(--line);
  padding:13px 18px;cursor:pointer;transition:all .15s ease;letter-spacing:.03em}
.choice:hover{background:rgba(127,215,255,.10);border-color:var(--acc);color:#fff;
  transform:translateX(4px)}
.choice .key{color:var(--acc);margin-right:12px;opacity:.85}
.choice.secret{border-color:rgba(195,155,255,.5)}
.choice.secret:hover{border-color:var(--rare);background:rgba(195,155,255,.08)}

body.shake #stage{animation:shake .45s ease}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}
  60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,2px)}}

/* ---------- ENDING SCREEN ---------- */
#screen-ending{background:
  radial-gradient(1000px 560px at 50% 110%,rgba(127,215,255,.08),transparent 60%),#04070d}
.end-card{width:min(640px,94vw);max-height:92vh;overflow:auto;background:rgba(8,16,30,.95);
  border:1px solid var(--line);padding:40px 38px 32px;text-align:center;
  animation:fadein .8s ease}
@keyframes fadein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#end-badge{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.32em;
  padding:8px 16px;border:1px solid;margin-bottom:20px;text-transform:uppercase}
.t-bad{color:var(--bad);border-color:var(--bad);background:rgba(255,93,93,.07)}
.t-normal{color:#9db8d2;border-color:#9db8d2;background:rgba(157,184,210,.06)}
.t-good{color:var(--good);border-color:var(--good);background:rgba(125,255,168,.06)}
.t-rare{color:var(--rare);border-color:var(--rare);background:rgba(195,155,255,.07)}
.t-true{color:var(--true);border-color:var(--true);background:rgba(255,209,102,.07)}
.t-silent{color:var(--silent);border-color:var(--silent);background:rgba(127,227,210,.06)}
#end-label{font-family:var(--mono);font-size:11px;letter-spacing:.4em;color:var(--dim)}
#end-name{font-family:var(--mono);font-size:clamp(28px,8vw,44px);letter-spacing:.24em;
  color:#eef9ff;margin:10px 0 20px;text-shadow:0 0 22px rgba(127,215,255,.3)}
#end-desc{font-family:var(--mono);font-size:14px;line-height:1.9;color:var(--txt2);text-align:left}
#end-progress{margin:24px 0 22px;font-family:var(--mono);font-size:12px;letter-spacing:.24em;color:var(--dim)}
.end-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- GALLERY / DEVS ---------- */
#gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px;margin-bottom:20px}
.gcard{border:1px solid rgba(127,215,255,.25);padding:16px;min-height:132px;
  background:rgba(10,20,36,.6);display:flex;flex-direction:column}
.gcard.locked{opacity:.45;border-style:dashed}
.gcard .gt{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--acc);margin-bottom:9px}
.gcard .gd{font-family:var(--mono);font-size:11.5px;line-height:1.65;color:var(--txt2);flex:1}

@media (max-width:640px){
  .stat{width:64px}
  #hud{gap:10px;padding:10px 12px}
  #hud-know{padding:6px 8px;font-size:10px}
  #text{font-size:14.5px;line-height:1.7}
  .choice{font-size:12px;padding:12px 14px}
  #dialog{padding:16px 16px 22px}
  .menu-nav{gap:10px}
  .mbtn{font-size:12.5px;letter-spacing:.16em}
}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<div id="scanlines"></div>
<div id="vignette"></div>
<button id="fs-exit" title="Выйти из полноэкранного режима">✕</button>

<!-- ================= MENU ================= -->
<section id="screen-menu" class="screen active">
  <div class="menu-wrap">
    <div class="menu-eyebrow" data-i="eyebrow">полярная станция «ПОЛЮС-1» · 89° ю.ш.</div>
    <h1 id="menu-title" data-text="ЭХО">ЭХО</h1>
    <div class="menu-sub" data-i="sub">сигнал с Полюса</div>
    <nav class="menu-nav">
      <button class="mbtn" id="btn-continue" data-i="cont" hidden>ПРОДОЛЖИТЬ</button>
      <button class="mbtn" id="btn-new" data-i="new">НОВАЯ ИГРА</button>
      <button class="mbtn" id="btn-endings" data-i="endings">КОНЦОВКИ</button>
      <button class="mbtn" id="btn-settings" data-i="settings">НАСТРОЙКИ</button>
    </nav>
    <div class="menu-foot">
      <span id="menu-ver"></span>
      <span id="menu-endcount"></span>
    </div>
  </div>
</section>

<!-- ================= GAME ================= -->
<section id="screen-game" class="screen">
  <header id="hud">
    <div class="stat"><span class="stat-name" data-i="h_trust">ДОВЕРИЕ</span><div class="bar"><i id="bar-trust"></i></div></div>
    <div class="stat"><span class="stat-name" data-i="h_sanity">РАССУДОК</span><div class="bar"><i id="bar-sanity"></i></div></div>
    <div class="stat"><span class="stat-name" data-i="h_power">ЭНЕРГИЯ</span><div class="bar"><i id="bar-power"></i></div></div>
    <div id="hud-know">0/6</div>
    <button id="btn-pause" data-i="pause">МЕНЮ</button>
  </header>
  <div id="chapter-card"><div id="ch-num"></div><div id="ch-name"></div></div>
  <main id="stage">
    <div id="dialog">
      <div id="speaker"></div>
      <div id="text"></div>
      <div id="next-hint">&#9660;</div>
    </div>
    <div id="choices"></div>
  </main>
</section>

<!-- ================= ENDING ================= -->
<section id="screen-ending" class="screen">
  <div class="end-card">
    <div id="end-badge" class="t-normal"></div>
    <div id="end-label"></div>
    <h2 id="end-name"></h2>
    <p id="end-desc"></p>
    <div id="end-progress"></div>
    <div class="end-btns">
      <button class="mbtn small" id="btn-end-menu" data-i="toMenu">В МЕНЮ</button>
      <button class="mbtn small" id="btn-end-again" data-i="again">ИГРАТЬ СНОВА</button>
      <button class="mbtn small" id="btn-end-gallery" data-i="endings">КОНЦОВКИ</button>
    </div>
  </div>
</section>

<!-- ================= OVERLAYS ================= -->
<div id="overlay-settings" class="overlay">
  <div class="panel">
    <button class="ov-x" id="ov-x-settings" title="Закрыть">✕</button>
    <h3 data-i="settings">НАСТРОЙКИ</h3>
    <label class="row"><span data-i="s_lang">ЯЗЫК / LANGUAGE</span>
      <select id="set-lang"><option value="ru">Русский</option><option value="en">English</option></select></label>
    <label class="row"><span data-i="s_master">ОБЩАЯ ГРОМКОСТЬ</span>
      <input type="range" id="set-master" min="0" max="100" step="5"></label>
    <label class="row"><span data-i="s_music">МУЗЫКА</span>
      <input type="range" id="set-music" min="0" max="100" step="5"></label>
    <label class="row"><span data-i="s_sfx">ЗВУКИ</span>
      <input type="range" id="set-sfx" min="0" max="100" step="5"></label>
    <label class="row"><span data-i="s_voice">ОЗВУЧКА ТЕКСТА</span>
      <input type="checkbox" id="set-voice"></label>
    <label class="row"><span data-i="s_vgender">ГОЛОС ОЗВУЧКИ</span>
      <select id="set-vgender"><option value="f"></option><option value="m"></option></select></label>
    <label class="row"><span data-i="s_rate">ТЕМП ГОЛОСА</span>
      <input type="range" id="set-rate" min="70" max="140" step="5"></label>
    <div class="note" data-i="s_voice_note"></div>
    <label class="row"><span data-i="s_tspeed">СКОРОСТЬ ТЕКСТА</span>
      <select id="set-speed">
        <option value="slow"></option><option value="normal"></option>
        <option value="fast"></option><option value="instant"></option>
      </select></label>
    <label class="row"><span data-i="s_fx">ЭФФЕКТЫ ЭКРАНА</span>
      <input type="checkbox" id="set-fx"></label>
    <label class="row" id="row-fs"><span data-i="s_fs">ПОЛНОЭКРАННЫЙ РЕЖИМ</span>
      <button class="mbtn small" id="btn-fs" data-i="s_fs_do">ВКЛЮЧИТЬ</button></label>
    <div class="note" data-i="s_fs_note"></div>
    <div class="row-btns">
      <button class="mbtn small" id="btn-set-reset" data-i="s_reset">СБРОСИТЬ</button>
      <button class="mbtn small" id="btn-set-close" data-i="back">НАЗАД</button>
    </div>
  </div>
</div>

<div id="overlay-endings" class="overlay">
  <div class="panel wide">
    <h3 data-i="endings">КОНЦОВКИ</h3>
    <div id="gallery"></div>
    <button class="mbtn small" id="btn-gal-close" data-i="back">НАЗАД</button>
  </div>
</div>

<div id="overlay-pause" class="overlay">
  <div class="panel">
    <h3 data-i="pause">ПАУЗА</h3>
    <button class="mbtn" id="btn-resume" data-i="resume">ПРОДОЛЖИТЬ</button>
    <button class="mbtn" id="btn-pause-settings" data-i="settings">НАСТРОЙКИ</button>
    <button class="mbtn" id="btn-pause-exit" data-i="toMenu">В МЕНЮ</button>
  </div>
</div>

<div id="overlay-confirm" class="overlay">
  <div class="panel">
    <p id="confirm-text"></p>
    <div class="row-btns">
      <button class="mbtn small" id="btn-yes" data-i="yes">ДА</button>
      <button class="mbtn small" id="btn-no" data-i="no">НЕТ</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   ЭХО · v0.9.1-beta · ранний доступ
   Один файл: вся графика, звук и озвучка генерируются в браузере.
   Выпуск на VK Play: упакуйте index.html в ZIP (файл в корне)
   и загрузите как HTML5-игру.

/* ---------- localStorage (безопасно для песочниц) ---------- */
var store = {
  get:function(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set:function(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del:function(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

/* ---------- настройки ---------- */
var DEFAULTS = { lang:'ru', master:1.0, music:0.55, sfx:0.95, voice:true, vgender:'f', rate:1.0, speed:'normal', fx:true };
var S = Object.assign({}, DEFAULTS, store.get('echo_settings', {}) || {});
function saveS(){ store.set('echo_settings', S); }

/* ---------- улики (знание) ---------- */
var CLUES = {
  c1:{ru:'запись на ленту',   en:'tape recording'},
  c2:{ru:'морзянка-тест',     en:'morse test'},
  c3:{ru:'архив 1963 года',   en:'the 1963 archive'},
  c4:{ru:'сдвиг задержки',    en:'the shifting delay'},
  c5:{ru:'опережение ответа', en:'the pre-emptive reply'},
  c6:{ru:'гул под льдом',     en:'the hum under the ice'}
};

/* ---------- концовки ---------- */
var END_ORDER = ['static','normal','good','voice','archive','silence'];
var ENDS = {

/* ============================================================
   ДВИЖОК

function $(id){ return document.getElementById(id); }

var state = { node:null, li:0, stats:{trust:3,sanity:4,power:4}, flags:{}, clues:[], chapter:0 };
var typing=false, typeTimer=null, autoTimer=null, autoFired=false;

/* ---------- экраны/оверлеи ---------- */
function showScreen(id){
  var all=document.querySelectorAll('.screen');
  for(var i=0;i<all.length;i++) all[i].classList.remove('active');
  $(id).classList.add('active');
}
function openOv(id){ $(id).classList.add('active'); }
function closeOv(id){ $(id).classList.remove('active'); }
function anyOverlayOpen(){
  var o=document.querySelectorAll('.overlay.active');
  return o.length>0;
}

/* ---------- HUD ---------- */
function updateHUD(){
  $('bar-trust').style.width  = Math.max(0,Math.min(6,state.stats.trust))/6*100+'%';
  $('bar-sanity').style.width = Math.max(0,Math.min(6,state.stats.sanity))/6*100+'%';
  $('bar-power').style.width  = Math.max(0,Math.min(6,state.stats.power))/6*100+'%';
  var kn=$('hud-know');
  kn.textContent = T('know')+': '+state.clues.length+'/6';
  var names=[];
  for(var i=0;i<state.clues.length;i++){
    var c=CLUES[state.clues[i]]; if(c) names.push(S.lang==='ru'?c.ru:c.en);
  }
  kn.title = names.length?names.join(' · '):'—';
}

/* ---------- глава ---------- */
function showChapter(n){
  var card=$('chapter-card');
  $('ch-num').textContent = T('chapter')+' '+n;
  $('ch-name').textContent = T('ch'+n);
  card.classList.add('show');
  AUDIO.stinger('chapter');
  setTimeout(function(){ card.classList.remove('show'); }, 2100);
}

/* ---------- сохранение ---------- */
function saveGame(){
  store.set('echo_save', { node:state.node, stats:state.stats, flags:state.flags,
    clues:state.clues, chapter:state.chapter });
}
function hasSave(){ var s=store.get('echo_save',null); return !!(s && s.node && N[s.node]); }

/* ---------- переход ---------- */
function go(id){
  var n=N[id]; if(!n) return;
  if(typeTimer){ clearTimeout(typeTimer); typeTimer=null; }
  if(autoTimer){ clearTimeout(autoTimer); autoTimer=null; }
  autoFired=false; typing=false;
  state.node=id; state.li=0;
  if(n.ch && n.ch!==state.chapter){ state.chapter=n.ch; showChapter(n.ch); }
  AUDIO.setMood(n.mood||'calm');
  if(n.ending) store.del('echo_save'); else saveGame();
  updateHUD();
  renderNode(false);
}

/* ---------- вывод строки ---------- */
function clearChoices(){ $('choices').innerHTML=''; }

function renderNode(instant){
  clearChoices();
  showLine(state.li, instant);
}

function lineHTML(line){
  var who=line[0], txt=(S.lang==='ru')?line[1]:line[2];
  return { who:who, txt:txt };
}

function showLine(idx, instant){
  var n=N[state.node]; if(!n) return;
  var L=n.lines[idx]; if(!L){ lineDone(); return; }
  if(typeTimer){ clearInterval(typeTimer); typeTimer=null; }
  typing=false;
  state.li=idx;
  var h=lineHTML(L), sp=$('speaker'), tx=$('text'), dl=$('dialog');
  sp.textContent = T('speakers')[h.who]||'';
  sp.className = h.who==='echo' ? 'who-echo' : '';
  tx.className = h.who==='echo' ? 'echo-line' : '';
  dl.className = h.who==='echo' ? 'echo' : '';
  $('next-hint').style.display='none';
  clearChoices();
  VOICE.speak(h.txt);
  if(h.who==='echo') AUDIO.whisper();
  if(h.who==='narr' && idx===0 && n.ending) AUDIO.staticBurst(0.12);

  if(instant || S.speed==='instant'){
    tx.textContent=h.txt; typing=false; lineDone(); return;
  }
  var speeds={slow:45, normal:26, fast:12};
  var ms=speeds[S.speed]!==undefined?speeds[S.speed]:26;
  typing=true; tx.textContent='';
  var i=0;
  typeTimer=setInterval(function(){
    i++;
    tx.textContent=h.txt.slice(0,i);
    if(i%3===0) AUDIO.tick();
    if(i>=h.txt.length){
      clearInterval(typeTimer); typeTimer=null; typing=false; lineDone();
    }
  }, ms);
}

function lineDone(){
  var n=N[state.node]; if(!n) return;
  if(state.li < n.lines.length-1){ $('next-hint').style.display='block'; return; }
  if(n.auto){
    if(!autoFired){
      autoFired=true;
      autoTimer=setTimeout(function(){ go(n.auto); }, 800);
    }
    return;
  }
  if(n.ending){
    var b=document.createElement('button');
    b.className='choice';
    b.innerHTML='<span class="key">&#9654;</span>'+T('btnNext');
    b.onclick=function(e){ e.stopPropagation(); AUDIO.select(); showEnding(n.ending); };
    $('choices').appendChild(b);
    return;
  }
  renderChoices();
}

function advance(){
  if(!state.node || anyOverlayOpen()) return;
  if(typing){
    if(typeTimer){ clearInterval(typeTimer); typeTimer=null; }
    typing=false;
    var n=N[state.node], L=n.lines[state.li], h=lineHTML(L);
    $('text').textContent=h.txt;
    lineDone();
    return;
  }
  var nn=N[state.node];
  if(state.li < nn.lines.length-1){ AUDIO.tick(); showLine(state.li+1,false); }
}

/* ---------- выборы ---------- */
function visibleChoices(){
  var n=N[state.node]; if(!n||!n.choices) return [];
  return n.choices.filter(function(c){ return !c.if || c.if(state); });
}

function renderChoices(){
  clearChoices();
  var list=visibleChoices();
  list.forEach(function(c,i){
    var b=document.createElement('button');
    b.className='choice'+(c.secret?' secret':'');
    b.innerHTML='<span class="key">'+(i+1)+'</span>'+(S.lang==='ru'?c.ru:c.en);
    b.onmouseenter=function(){ AUDIO.hover(); };
    b.onclick=function(e){ e.stopPropagation(); choose(c); };
    $('choices').appendChild(b);
  });
}

function applyEffects(d){
  if(!d) return false;
  if(d.trust)  state.stats.trust  = Math.max(0,Math.min(6,state.stats.trust+d.trust));
  if(d.sanity) state.stats.sanity = Math.max(0,Math.min(6,state.stats.sanity+d.sanity));
  if(d.power)  state.stats.power  = Math.max(0,Math.min(6,state.stats.power+d.power));
  if(d.flags) d.flags.forEach(function(f){ state.flags[f]=true; });
  if(d.clues) d.clues.forEach(function(c){ if(state.clues.indexOf(c)<0) state.clues.push(c); });
  updateHUD(); saveGame();
  if(state.stats.sanity<=0 && state.node!=='end_static'){
    state.flags._madness=true;
    go('end_static');
    return true;
  }
  return false;
}

function choose(c){
  AUDIO.select();
  if(applyEffects(c.do)) return;
  var to=(typeof c.to==='function')?c.to(state):c.to;
  if(to) go(to);
}

/* ---------- концовки ---------- */
function unlockedEndings(){ return store.get('echo_endings',[])||[]; }

function showEnding(id){
  var e=ENDS[id]; if(!e) return;
  var un=unlockedEndings();
  if(un.indexOf(id)<0){ un.push(id); store.set('echo_endings',un); }
  VOICE.stop();
  AUDIO.endingStinger(e.t);
  var badge=$('end-badge');
  badge.className='t-'+e.t;
  badge.textContent=T('badge')[e.t]||'';
  $('end-label').textContent=T('endLabel')+' '+(END_ORDER.indexOf(id)+1)+' '+T('of')+' '+END_ORDER.length;
  $('end-name').textContent=S.lang==='ru'?e.ru:e.en;
  $('end-desc').textContent=S.lang==='ru'?e.dru:e.den;
  $('end-progress').textContent=T('unlocked')+': '+un.length+' / '+END_ORDER.length;
  updateMenuMeta();
  showScreen('screen-ending');
}

/* ---------- галерея концовок ---------- */
function renderGallery(){
  var g=$('gallery'), un=unlockedEndings();
  g.innerHTML='';
  END_ORDER.forEach(function(id){

    var d=document.createElement('div');

  $('set-sfx').oninput=function(){ S.sfx=this.value/100; saveS(); AUDIO.applyVolumes(); AUDIO.tone(660,0.12,'sine',0.25); };

  $('set-vgender').onchange=function(){ S.vgender=this.value; saveS(); AUDIO.click(); };
  $('btn-fs').onclick=function(){ AUDIO.click(); if(!FS.active()){ FS.enter(); closeAllOv(); } };

/* ---------- снег ---------- */
function startSnow(){
  var cv=$('snow'), ctx=cv.getContext('2d'), flakes=[], W,H;
  function size(){ W=cv.width=window.innerWidth; H=cv.height=window.innerHeight; }
  window.addEventListener('resize',size); size();
  for(var i=0;i<110;i++){
    flakes.push({ x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.8+0.4,
      s:Math.random()*0.5+0.15, d:Math.random()*0.6-0.3 });
  }
  (function loop(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='rgba(200,230,255,.55)';
    for(var i=0;i<flakes.length;i++){
      var f=flakes[i];
      f.y+=f.s; f.x+=f.d+Math.sin(f.y/60)*0.2;
      if(f.y>H+4){ f.y=-4; f.x=Math.random()*W; }
      if(f.x>W+4) f.x=-4; if(f.x<-4) f.x=W+4;
      ctx.globalAlpha=0.25+f.r*0.3;
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,6.283); ctx.fill();
    }
    ctx.globalAlpha=1;
    requestAnimationFrame(loop);
  })();
}

/* ---------- полноэкранный режим ----------
   Включается кнопкой в настройках. Выключается только крестиком,
   закрытием окна настроек или ESC (стандарт браузера). */
var FS = {
  supported:function(){
    var el=document.documentElement;
    return !!(el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen);
  },
  active:function(){
    return !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement);
  },
  enter:function(){
    var el=document.documentElement;
    var f=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen;
    if(!f) return;
    try{ var p=f.call(el); if(p&&p.catch)p.catch(function(){}); }catch(e){}
  },
  exit:function(){
    var f=document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen||document.msExitFullscreen;
    if(!f) return;
    try{ var p=f.call(document); if(p&&p.catch)p.catch(function(){}); }catch(e){}
  },
  sync:function(){
    var on=this.active(), b=$('btn-fs');
    if(b){ b.disabled=on; b.textContent = on ? T('s_fs_on') : T('s_fs_do'); }
    var x=$('fs-exit');
    if(x) x.classList.toggle('show',on);
  }
};
document.addEventListener('fullscreenchange',function(){ FS.sync(); });
document.addEventListener('webkitfullscreenchange',function(){ FS.sync(); });

/* ---------- привязка UI ---------- */
function bindUI(){
  $('btn-new').onclick=function(){ AUDIO.click(); if(hasSave()){ $('confirm-text').textContent=T('confirmNew'); openOv('overlay-confirm'); } else doNew(); };
  $('btn-continue').onclick=function(){ AUDIO.click(); doContinue(); };
  $('btn-endings').onclick=function(){ AUDIO.click(); renderGallery(); openOv('overlay-endings'); };
  $('btn-settings').onclick=function(){ AUDIO.click(); syncSettings(); openOv('overlay-settings'); };
  $('btn-yes').onclick=function(){ AUDIO.click(); doNew(); };
  $('btn-no').onclick=function(){ AUDIO.click(); closeOv('overlay-confirm'); };

  /* закрыть настройки — если включён полноэкранный, он тоже выключается */
  var closeSet=function(){ AUDIO.click(); closeOv('overlay-settings'); if(FS.active()) FS.exit(); };
  $('btn-set-close').onclick=closeSet;
  $('ov-x-settings').onclick=closeSet;
  $('fs-exit').onclick=function(e){ e.stopPropagation(); AUDIO.click(); FS.exit(); };
  $('btn-gal-close').onclick=function(){ AUDIO.click(); closeOv('overlay-endings'); };

  $('btn-pause').onclick=function(e){ e.stopPropagation(); AUDIO.click(); VOICE.stop(); openOv('overlay-pause'); };
  $('btn-resume').onclick=function(){ AUDIO.click(); closeOv('overlay-pause'); };
  $('btn-pause-settings').onclick=function(){ AUDIO.click(); closeOv('overlay-pause'); syncSettings(); openOv('overlay-settings'); };
  $('btn-pause-exit').onclick=function(){ AUDIO.click(); closeAllOv(); showScreen('screen-menu'); updateMenuMeta(); };

  $('btn-end-menu').onclick=function(){ AUDIO.click(); showScreen('screen-menu'); updateMenuMeta(); };
  $('btn-end-again').onclick=function(){ AUDIO.click(); doNew(); };
  $('btn-end-gallery').onclick=function(){ AUDIO.click(); renderGallery(); openOv('overlay-endings'); };

  $('dialog').onclick=function(){ advance(); };

  /* звук при наведении на кнопки меню */
  document.addEventListener('mouseover',function(e){
    var t=e.target;
    if(t && t.classList && (t.classList.contains('mbtn')) && !t._hovered){
      t._hovered=true; AUDIO.hover();
      setTimeout(function(){ t._hovered=false; },300);
    }
  });

  /* первый жест пользователя — запуск аудио */
  var kick=function(){ AUDIO.init(); document.removeEventListener('pointerdown',kick); document.removeEventListener('keydown',kick); };
  document.addEventListener('pointerdown',kick);
  document.addEventListener('keydown',kick);

  /* клавиатура */
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
      if($('screen-game').classList.contains('active')){
        if(anyOverlayOpen()) closeAllOv(); else { VOICE.stop(); openOv('overlay-pause'); }
      }
      return;
    }
    if(!$('screen-game').classList.contains('active')||anyOverlayOpen()) return;
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); advance(); return; }
    var num=parseInt(e.key,10);
    if(num>=1&&num<=9){
      var list=visibleChoices();
      if(list[num-1]){ AUDIO.click(); choose(list[num-1]); }
    }
  });
}

/* ---------- СТАРТ ---------- */
function init(){
  if(!FS.supported()) $('row-fs').style.display='none';
  syncSettings();
  bindSettings();
  bindUI();
  applyLang();
  updateMenuMeta();
  startSnow();
  showScreen('screen-menu');
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
else init();

})();
</script>
</body>
